<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YOMIKATA PRO - Story Mode</title>
<style>
:root {
  --bg-main: radial-gradient(circle at top, #0f172a, #020617); --card-bg: rgba(30, 41, 59, 0.95);
  --primary: #38bdf8; --success: #22c55e; --danger: #ef4444; --warning: #eab308; --gold: #fbbf24;
  --text-main: #f8fafc; --text-sub: #94a3b8;
}

body { font-family: 'Segoe UI', sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; overflow-x: hidden; }
.container { width: 100%; max-width: 700px; position: relative; display: flex; flex-direction: column; flex-grow: 1; }
button { touch-action: manipulation; }
.hidden { display: none !important; }

@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.animate-slide { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

/* HEADER & RPG BAR (DISEDERHANAKAN UNTUK MODE MEMBACA) */
.rpg-bar { 
  display: flex; justify-content: space-between; align-items: center; 
  background: rgba(10, 15, 28, 0.85); backdrop-filter: blur(12px);
  padding: 10px 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); 
  margin-top: 10px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); 
  position: sticky; top: 10px; z-index: 950;
}
.mode-badge {
  background: linear-gradient(135deg, rgba(234, 179, 8, 0.2), rgba(249, 115, 22, 0.2));
  color: var(--gold); border: 1px solid rgba(251, 191, 36, 0.4);
  padding: 5px 12px; border-radius: 8px; font-weight: bold; font-size: 12px;
  text-transform: uppercase; letter-spacing: 1px;
}
.btn-exit {
  background: #334155; color: white; border: none; padding: 6px 12px;
  border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; transition: 0.2s;
}
.btn-exit:hover { background: var(--danger); }

/* AREA MEMBACA CERITA */
.story-card { 
  background: var(--card-bg); padding: 30px 25px; border-radius: 20px; 
  box-shadow: 0 10px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05);
  flex-grow: 1; display: flex; flex-direction: column;
}

.story-title {
  color: var(--primary); font-size: 18px; font-weight: bold; 
  border-bottom: 2px dashed #334155; padding-bottom: 15px; margin-bottom: 25px;
  text-align: center; line-height: 1.4;
}

/* FORMAT TEKS JEPANG & FURIGANA (HINT ARTI AKTIF) */
.story-content {
  font-size: 24px; line-height: 3.5; /* Line height super besar agar tooltip tidak nabrak */
  color: var(--text-main); font-weight: 500;
  flex-grow: 1;
}

ruby { cursor: pointer; user-select: none; transition: color 0.3s; ruby-position: over; position: relative; display: inline-block; }
ruby:hover { color: var(--primary); }

rt { 
  display: block; font-size: 0.5em; color: var(--warning); 
  opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.5); 
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
  position: absolute; bottom: 85%; left: 50%; white-space: nowrap; pointer-events: none; 
}
ruby.show rt { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
ruby.show { color: var(--primary); }

/* TOOLTIP ARTI */
ruby .arti-hint { 
  position: absolute; bottom: -35px; left: 50%; transform: translateX(-50%); 
  background-color: #0f172a; color: var(--success); padding: 5px 12px; 
  border-radius: 8px; font-size: 14px; font-weight: bold; white-space: nowrap; 
  opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
  z-index: 100; border: 1px solid var(--success); box-shadow: 0 4px 15px rgba(0,0,0,0.8); 
}
ruby.show .arti-hint { opacity: 1; transform: translateX(-50%) translateY(5px); }
ruby.show .arti-hint::after {
  content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
  border-width: 0 6px 6px 6px; border-style: solid; border-color: transparent transparent var(--success) transparent;
}

/* NAVIGASI HALAMAN */
.nav-controls {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05);
}
.btn-nav {
  background: var(--primary); color: #000; border: none; padding: 12px 20px;
  border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s;
}
.btn-nav:hover { filter: brightness(1.2); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); }
.btn-nav.disabled { background: #334155; color: #94a3b8; cursor: not-allowed; box-shadow: none; transform: none; filter: none; opacity: 0.5;}

.page-indicator { color: var(--text-sub); font-size: 14px; font-weight: bold; letter-spacing: 2px;}

@media (min-width: 768px) {
  .container { max-width: 600px; margin-top: 5vh; }
  .story-card { padding: 40px 50px; }
}

</style>
</head>
<body>

<div class="container" id="main-app">
  
  <div class="rpg-bar animate-slide">
    <div class="mode-badge">📖 MODE PRO</div>
    <button class="btn-exit" onclick="alert('Kembali ke Menu Utama Yomikata (Integrasi sistem nanti)')">Kembali</button>
  </div>

  <div class="story-card animate-slide" style="animation-delay: 0.1s;">
    <div class="story-title" id="story-title">Memuat Cerita...</div>
    
    <div class="story-content" id="story-content">
      </div>

    <div class="nav-controls">
      <button class="btn-nav disabled" id="btn-prev" onclick="StoryEngine.prevPage()">⬅️ Mundur</button>
      <div class="page-indicator" id="page-indicator">1 / 1</div>
      <button class="btn-nav" id="btn-next" onclick="StoryEngine.nextPage()">Lanjut ➡️</button>
    </div>
  </div>

</div>

<script>
// ==========================================
// DATABASE CERITA (STORY MODE)
// ==========================================
const StoryDB = [
  {
    id: "ep1",
    title: "エピソード 1 : 不思議な 猫<br><small style='font-size:12px; color:var(--text-sub);'>(Episode 1: Kucing Misterius)</small>",
    pages: [
      // HALAMAN 1
      [
        {k: "昨日", r: "きのう", a: "Kemarin"}, {text: "、"},
        {k: "ケンさん", a: "Ken"}, {text: "は "},
        {k: "古い", r: "ふるい", a: "Tua / Lama"}, {k: "公園", r: "こうえん", a: "Taman"}, {text: "に "},
        {k: "行きました", r: "いきました", a: "Pergi"}, {text: "。<br>"},
        {k: "公園", r: "こうえん", a: "Taman"}, {text: "は とても "},
        {k: "静か", r: "しずか", a: "Tenang"}, {text: "でした。"}
      ],
      // HALAMAN 2
      [
        {k: "大きい", r: "おおきい", a: "Besar"}, {k: "木", r: "き", a: "Pohon"}, {text: "の "},
        {k: "下", r: "した", a: "Bawah"}, {text: "に、"},
        {k: "可愛い", r: "かわいい", a: "Lucu / Imut"}, {k: "猫", r: "ねこ", a: "Kucing"}, {text: "が "},
        {k: "いました", r: "いました", a: "Ada (Lampau)"}, {text: "。<br>"},
        {k: "猫", r: "ねこ", a: "Kucing"}, {text: "は "},
        {k: "白い", r: "しろい", a: "Putih"}, {k: "猫", r: "ねこ", a: "Kucing"}, {text: "でした。"}
      ],
      // HALAMAN 3
      [
        {k: "ケンさん", a: "Ken"}, {text: "は "},
        {k: "猫", r: "ねこ", a: "Kucing"}, {text: "の "},
        {k: "近く", r: "ちかく", a: "Dekat"}, {text: "に "},
        {k: "行きました", r: "いきました", a: "Pergi"}, {text: "。<br>"},
        {text: "あれ？ "},
        {k: "猫", r: "ねこ", a: "Kucing"}, {text: "の "},
        {k: "隣", r: "となり", a: "Di sebelah"}, {text: "に "},
        {k: "不思議", r: "ふしぎ", a: "Aneh / Misterius"}, {text: "な "},
        {k: "本", r: "ほん", a: "Buku"}, {text: "が "},
        {k: "ありました", r: "ありました", a: "Ada (Lampau)"}, {text: "。"}
      ]
    ]
  }
];

const StoryEngine = {
  currentStoryIdx: 0,
  currentPage: 0,

  init: function() {
    this.renderPage();
  },

  buildRubyFormat: function(k, r, a) {
    if (!k) return "";
    
    // Jika tidak ada Romaji (misal untuk nama orang), pakai Kanji saja
    let furigana = r ? `<rt>${r}</rt>` : "";
    let tooltip = a ? `<div class="arti-hint">${a}</div>` : "";
    
    return `<ruby onclick="this.classList.toggle('show')">${k}${furigana}${tooltip}</ruby>`;
  },

  renderPage: function() {
    const story = StoryDB[this.currentStoryIdx];
    const pageData = story.pages[this.currentPage];
    
    document.getElementById('story-title').innerHTML = story.title;
    
    let htmlContent = "";
    pageData.forEach(item => {
      if (item.k) {
        htmlContent += this.buildRubyFormat(item.k, item.r, item.a);
      } else if (item.text) {
        htmlContent += item.text;
      }
    });

    // Animasi transisi halus saat ganti halaman
    const contentEl = document.getElementById('story-content');
    contentEl.style.opacity = 0;
    setTimeout(() => {
        contentEl.innerHTML = htmlContent;
        contentEl.style.opacity = 1;
    }, 200);

    this.updateControls(story.pages.length);
  },

  updateControls: function(totalPages) {
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    
    document.getElementById('page-indicator').innerText = `${this.currentPage + 1} / ${totalPages}`;

    if (this.currentPage === 0) {
      btnPrev.classList.add('disabled');
    } else {
      btnPrev.classList.remove('disabled');
    }

    if (this.currentPage === totalPages - 1) {
      btnNext.innerText = "Selesai 🎉";
      btnNext.style.background = "var(--success)";
    } else {
      btnNext.innerText = "Lanjut ➡️";
      btnNext.style.background = "var(--primary)";
    }
  },

  nextPage: function() {
    const totalPages = StoryDB[this.currentStoryIdx].pages.length;
    if (this.currentPage < totalPages - 1) {
      this.currentPage++;
      this.renderPage();
    } else {
      alert("Cerita Selesai! EXP dan Koin akan ditambahkan di integrasi berikutnya.");
    }
  },

  prevPage: function() {
    if (this.currentPage > 0) {
      this.currentPage--;
      this.renderPage();
    }
  }
};

window.onload = () => StoryEngine.init();

</script>
</body>
</html>
